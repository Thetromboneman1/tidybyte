name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate immutable action references
        run: |
          ruby tests/validate_workflow_pins_test.rb
          ruby scripts/validate_workflow_pins.rb

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Select available iPhone simulator
        id: simulator
        run: |
          simulator_udid="$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          for runtime in sorted(devices, reverse=True):
              for device in devices[runtime]:
                  if device.get("isAvailable") and device["name"].startswith("iPhone"):
                      print(device["udid"])
                      raise SystemExit(0)
          raise SystemExit("No available iPhone simulator found")
          ')"
          echo "udid=$simulator_udid" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          xcodebuild build \
            -project Tidybyte.xcodeproj \
            -scheme Tidybyte \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO

      - name: Test
        run: |
          xcodebuild test \
            -project Tidybyte.xcodeproj \
            -scheme TidybyteTests \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO
